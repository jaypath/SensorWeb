; Bryant Evolution listen-only controller. ESP32-S3-N16R8.
; Wiring table: BryantHP_wiring.md
; UART1 RX GPIO 16, 38400 8N1. No TX pin. The firmware never writes the bus.
; Outside temp: Bryant frame, else a non-server temperature (OAT checks or an
; outside-flagged peripheral), else a weather server, preferring its outdoor aggregate.
; Attic climate: AHT 0x38 temp and humidity, BMP280 0x76 pressure.
; I2C SDA GPIO 8, SCL GPIO 9. Sensors stay powered.
; SD SPI matches the other hubs: SCK 39, MISO 38, MOSI 40, CS 41.
; SSD1306 128x64 OLED shares I2C at 0x3C. GPIO 48 is the onboard LED and is unused.
