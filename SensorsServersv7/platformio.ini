; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
;not for automation
; LovyanGFX: use GitHub master for gpio_hal_func_sel fix (ESP32 core 3.3.x); no patch needed
;platform = espressif32@6.5.0
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
; Equal OTA slots: 0x1F0000 each @ 0x10000 / 0x200000 (same layout as partitions_wt32sc01_ota_no_spiffs.csv on servers)
board_build.partitions = partitions_ota_no_spiffs.csv
board_build.mcu = esp32
board_build.f_cpu = 240000000L
upload_speed = 921600
monitor_speed = 115200
; CMN CA bundle (~68KB flash) for HTTPS (TimeAPI, weather, etc.); inherited by all envs unless overridden
board_build.sdkconfig.defaults =
	CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
	CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=y
	CONFIG_ARDUINO_LOOP_STACK_SIZE=24576
; Use larger partition scheme if you have 4MB flash (gives ~1.9MB app space instead of 1.25MB)
; Uncomment the line below if your ESP32 has 4MB flash:
;board_build.partitions = default_4MB.csv
; Or use huge_app partition for maximum app space (if you don't need OTA):
;board_build.partitions = huge_app.csv
lib_deps = 
	SPI
	bblanchon/ArduinoJson@^7.0.3
	paulstoffregen/Time@^1.6.1
	arduino-libraries/NTPClient@^3.2.1
; Skip unused legacy libs (interrupt logic is in src/interrupt_triggers.*).
lib_ignore = 
	Trigger_RCWL
	Trigger_Switch_Lights
	SensorInterrupt
build_flags = 
	;-D _USEDETAILEDSTATUSWEBHTML=1 ;add details about web traffic to status page
	;-D _USEDETAILEDWEATHERWEBHTML=1 ;add detailed weather information to weather page
	-D TIMEZERO=1735689600 ;time zero is 2025-01-01 00:00:00. This is the earliest time that can be considered valid for sensor responses and alivesince.
	-D WDT_TIMEOUT_MS=120000
	-D ARDUINO_LOOP_STACK_SIZE=24576
	-D _USEUDP=49157 ;UDP port for data sending/receiving
	-D _USEUDP_MULTICAST=239,187,42,17 ;just an arbitrary multicast group that is within the private/local use range
	;-D _USEUDP_MULTICAST=255,255,255,255 ;broadcast to all devices on the network
	-D _USEADCATTEN=ADC_6db ;ADC_11db, ADC_6db, or ADC_2_5db or ADC_0db (for esp32 adc)
	-D _USEADCBITS=10 ;10, 11, or 12 (for esp32 adc)
	-D _USE_CERT_BUNDLE=1 ; use ESP-IDF CMN x509 bundle in SendHTTPMessage (setCacert "bundle")
	-D _USENETWORKMONITOR=0 ; set to 1 to enable network monitor (compiles NetworkMonitor.cpp + ESP32Ping)
	-D _USESUPABASE=1 ; Prefs cloud fields on all envs. Enable query/upload with -D _SUPABASE_RUNTIME=1 per env.
	-Os ; Optimize for size (smallest binary)
	-ffunction-sections ; Place each function in its own section
	-fdata-sections ; Place each data item in its own section
	-Wl,--gc-sections ; Remove unused sections
	-D ARDUINO_USB_CDC_ON_BOOT=0 ; Disable USB CDC if not needed
	-D CORE_DEBUG_LEVEL=0 ; Disable debug output
	; Do not add -D CONFIG_* here (except APP_PROJECT_VER): sdkconfig.h overrides them, and HybridCompile envs
	; pass build_flags into the IDF build where -Werror turns the redefinition into an error.
	-D CONFIG_APP_PROJECT_VER=\"11.0.8\" ; firmware version (esp_app_desc, x.xx.xx). Edit here only.
	;11.0.8 - Hubs can read and set another device's mesh parameters over HTTP. Mesh Settings page. Peripherals show the preferred path to a hub. Status lists the Wi-Fi AP under Channel.
	;11.0.7 - added remote sending of errors to hub
	; BLE Wi-Fi provisioning (Espressif WiFiProv, NimBLE host). Default OFF (ble_provision.hpp). Enable per-env with
	; -D _USE_BLE_PROV=1; classic ESP32 envs also need the [nimble_esp32] custom_sdkconfig. SoftAP wizard unchanged.
	;11.0.6 - Mesh: hourly presence if a peripheral has not originated a broadcast; hub delinquent-MAC broadcast; neighbors store link-layer RSSI and short-hold relays to or from a heard delinquent. Directed pings to a hub's own delinquents use critical TTL.
	;11.0.5 - Mesh: directed frames (ping/ACK/sensor req) exempt from relay suppression; RX queue 8->16; status page shows WiFi channel/AP, mesh errors, RX drops, relays sent/suppressed, last frame heard (MAC+RSSI).
	;11.0.4 - ArborysMesh multi-hop fixes: all frames sent as 802.11 broadcast so relays hear unicasts; ACK has own seq (echo in payload); random boot seq; accept out-of-order relayed frames; ping resends; critical net error relays before reboot; relay suppression (drop queued relay after 2 copies heard, RSSI-weighted delay: far nodes relay first).
	;11.0.3 - BLE provisioning on classic ESP32 via NimBLE (HybridCompile, BLE-only controller, 1 conn); removed no-op -D CONFIG_* flags.
	;11.0.2 - Peripheral web/HTML slim; Supabase hub-only; history default 3; STATUS counts-only.
	;11.0.1 - BLE provisioning via Espressif WiFiProv (30-minute boot window, FREE_BTDM/BLE on teardown); SoftAP path unchanged.
	;9.4.0 - version update with numerous updates to sensors, network monitor, status page, and other features.
	;9.4.1 - ping rtt display on main  page
	;9.4.2 - fixed a bug in which sensors were not added at boot correctly, added networkmonitor types to sensor types for flagging and searching
	;9.4.3 - fixed a bug in which graphics displayed wifi not connecting correctly (when it was), server logs when firmware update completes, multiple bug fixes.
	;9.4.4 - fixed graphics display so that all sensors are not displayed
	;9.4.5 - fixed a bug in the wifi AP path, where it connected/disconnected incorrectly when the wifi was not connected.
	;9.4.6 - Reduced IGMP reporting interval to 60s. Changed status page to display more web based info
	;9.4.7 - updated firmware request reporting
	;9.4.8 - focused ota update
	;9.4.9 - Fixed a wifi reconnect issue that prevented reconnecting to the wifi after WiFi down
	;9.4.10 - Fixed a bug in which the network monitor was not working correctly, added ping success rate to the status page, and added smoke and haze weather types.
	;9.4.11 - added the ability to manually add a device.
	;9.4.12 - fixed a bug in which hybrid server/sensors expired their own sensors, chunked page loading, and other bug fixes.
	;9.4.14 - Join strongest BSSID for configured SSID at connect; re-evaluate every 30 min (not persisted).
	;9.4.15 - status banner updated and reduced blocking gsheet/weather functions; updated to async messaging for faster loop execution.
	;9.4.16 - added weatherlite type and environment; updated to async messaging for faster loop execution.
	;9.4.17 - weatherlite: refresh current conditions from sensors/forecast + stale package request; firmware OTA keep-alive chunked pull.
	;9.4.18 - ESPNow: defer RX processing off recv CB, serialize sends/peer delete, fix peer leak on sync fail, fix WiFi-PW MAC byte order.
	;9.4.19 - SD card improvements for drag and drop firmware updates.
	;9.4.20 - Recover STA associated-without-IP (0.0.0.0); blocking HTTP alarmsReq/alarmsAck (hubs return network alarms, peripherals return own + error:notServer).
	;9.4.21 - ArborysSnsType limitHigh/limitLow (NaN=unset); include in JSON snsData (UDP/HTTP); hubs store on receive. ESPNOW binary unchanged (no room).
	;9.4.22 - Auto-zero toggle for scaled sensors (soil default ON): adjusts calib min so scaled readings never go negative; checkbox on /SENSOR_SETUP.
	;10.0.0 - added supabase support for device registration and management.
	;10.0.1 - ArborysNet TLS keepalive off loop (fix ArbNet Png reboots); stream CONFIG/STATUS/web pages in small chunks (fix peripheral blank pages); safer stale TLS release; log unexpected reset reason.
	;10.0.2 - UTC hard cutover: store/compare sensor, weather, SD, and LAN times as UTC; display via dateifyLocal; hub-centric Supabase upload.
	;10.0.3 - ArborysNet boot Ping/keepalive use fire-and-forget upsert (full name/IP/MAC); Quit ArborysNet on /CONFIG; sunrise unix validation no longer uses isTimeValid (future events); platformio env cleanup (wthrlite).
	;10.0.4 - Sensor-box EXP display waits until 2× SendingInt; header EXP and expired pings stay at 1.25×.
	;10.0.5 - Shed lights switch: off→arm timer, on→clear + ignore RCWL; shared snsValue +on/-ignore.
build_src_filter =
	+<*>
	-<NetworkMonitor.cpp>
build_unflags = 
	-O2 ; Remove default optimization
	-g ; Remove debug symbols (adds significant size)

; Classic ESP32 (esp32dev) BLE provisioning host: NimBLE, BLE-only controller, 1 connection, peripheral role only.
; The prebuilt Arduino libs for classic ESP32 ship Bluedroid + Classic BT (too large for 0x1F0000 OTA slots),
; so envs that use this trigger pioarduino HybridCompile (IDF libs rebuilt once; rebuilt again when switching
; to a different chip family or a different custom_sdkconfig). Overwrites project sdkconfig.defaults.
; Use with: custom_sdkconfig = ${nimble_esp32.custom_sdkconfig}   (S3 envs: prebuilt libs are already NimBLE)
[nimble_esp32]
custom_sdkconfig =
	CONFIG_BT_ENABLED=y
	'# CONFIG_BT_BLUEDROID_ENABLED is not set'
	CONFIG_BT_NIMBLE_ENABLED=y
	'# CONFIG_BT_CONTROLLER_ONLY is not set'
	'# CONFIG_BT_CLASSIC_ENABLED is not set'
	CONFIG_BTDM_CTRL_MODE_BLE_ONLY=y
	'# CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY is not set'
	'# CONFIG_BTDM_CTRL_MODE_BTDM is not set'
	CONFIG_BTDM_CTRL_BLE_MAX_CONN=1
	'# CONFIG_BTDM_BLE_SCAN_DUPL is not set'
	CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y
	CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=5120
	CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	CONFIG_BT_NIMBLE_MAX_BONDS=1
	CONFIG_BT_NIMBLE_MAX_CCCDS=4
	'# CONFIG_BT_NIMBLE_NVS_PERSIST is not set'
	'# CONFIG_BT_NIMBLE_ROLE_CENTRAL is not set'
	'# CONFIG_BT_NIMBLE_ROLE_OBSERVER is not set'
	CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=y
	CONFIG_BT_NIMBLE_ROLE_BROADCASTER=y
	'# CONFIG_BT_NIMBLE_GATT_CLIENT is not set'
	CONFIG_BT_NIMBLE_GATT_SERVER=y
	CONFIG_BT_NIMBLE_WHITELIST_SIZE=1
	'# CONFIG_BT_NIMBLE_ENABLE_CONN_REATTEMPT is not set'
	'# CONFIG_BT_NIMBLE_50_FEATURE_SUPPORT is not set'
	CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=12
	CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=12
	CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=12
	CONFIG_BT_NIMBLE_TRANSPORT_EVT_COUNT=16
	'# CONFIG_BT_NIMBLE_PROX_SERVICE is not set'
	'# CONFIG_BT_NIMBLE_ANS_SERVICE is not set'
	'# CONFIG_BT_NIMBLE_CTS_SERVICE is not set'
	'# CONFIG_BT_NIMBLE_HTP_SERVICE is not set'
	'# CONFIG_BT_NIMBLE_IPSS_SERVICE is not set'
	'# CONFIG_BT_NIMBLE_TPS_SERVICE is not set'
	'# CONFIG_BT_NIMBLE_IAS_SERVICE is not set'
	'# CONFIG_BT_NIMBLE_LLS_SERVICE is not set'
	'# CONFIG_BT_NIMBLE_SPS_SERVICE is not set'
	'# CONFIG_BT_NIMBLE_HR_SERVICE is not set'
	'# CONFIG_BT_NIMBLE_BAS_SERVICE is not set'
	'# CONFIG_BT_NIMBLE_DIS_SERVICE is not set'
	CONFIG_BT_NIMBLE_LOG_LEVEL_NONE=y
	'# CONFIG_BT_NIMBLE_LOG_LEVEL_INFO is not set'
	'# CONFIG_BT_NIMBLE_PRINT_ERR_NAME is not set'
	CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
	'# CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL is not set'
	CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=y
	CONFIG_ARDUINO_LOOP_STACK_SIZE=24576
; Unused managed components (esp_insights breaks HybridCompile). Keep network_provisioning + qrcode (WiFiProv), mdns (ArduinoOTA).
custom_component_remove =
	espressif/esp_hosted
	espressif/esp_wifi_remote
	espressif/esp-dsp
	espressif/esp_modem
	espressif/esp32-camera
	espressif/libsodium
	espressif/esp-modbus
	espressif/esp_insights
	espressif/esp_diag_data_store
	espressif/esp_diagnostics
	espressif/cbor
	espressif/esp_rainmaker
	espressif/rmaker_common
	espressif/esp-zigbee-lib
	espressif/esp-zboss-lib
	espressif/esp_matter
	espressif/esp-serial-flasher
	chmorgan/esp-libhelix-mp3


; Device roles (independent; not mutually exclusive). See src/device_roles.hpp.
;   Defaults (device_roles.hpp): _HAS_LOCAL_SENSORS=0, _IS_SERVER_HUB=0 — every env must set at least one to 1.
;   Sensor node:  _HAS_LOCAL_SENSORS=1 (_IS_SERVER_HUB defaults 0; set =0 explicitly for clarity)
;   Weather hub:  _IS_SERVER_HUB=1
;   Hybrid:       _HAS_LOCAL_SENSORS=1 _IS_SERVER_HUB=1 _MYTYPE=100
;   Supabase query/upload: -D _SUPABASE_RUNTIME=1 (default 0; Prefs fields still from _USESUPABASE=1)
;   Device types (_MYTYPE / devType): 1–99 peripheral, 100–150 server.
;   Sensor types 100–150 = server slots; 200–255 = interrupt-driven sensors.
;   Interrupt sensors: set _USEINTERRUPT=1 (src/interrupt_triggers.hpp/.cpp).
;   Type 200 (RCWL): _PIN_ENABLE_RCWL (GPIO, driven HIGH at setup), _RCWL_ASSOCIATED_SNS (prefs index of type 73).
;     Rising edge only; rate-limited to poll_interval. If Lights remaining < 120s, add poll_interval+5.
;   Type 220 (button): _BUTTON_ASSOCIATED_SNS (prefs index). Rising edge: on→0 (uncounted), off→arm to button poll_interval (counted).
;     Debounce via _INTERRUPT_DEBOUNCE_MS (default 50).
;   Type 75 (clock DIO out): limitMin=on hour, limitMax=off hour (0–23, -1=dawn, -2=dusk). snsValue 0/1. No IRQ.
;   Poll interval 0 = never run that sensor's update. SendingInt is the max hub send rate.
;   _USENETWORKMONITOR=1 — compile NetworkMonitor.cpp and add ESP32Ping (see MainServer envs).
;   Default build_src_filter excludes NetworkMonitor.cpp; MainServer envs override with +<*>.
;   RSSI tracking (snsType 80) is universal and lives in STRUCT_CORE I via updateRSSI() in server.cpp.
;   Network monitor snsTypes 81-89 trigger tests on demand when ReadData() runs for that sensor.
; _NETWORKMONITOR_DOWNLOAD_KB: Cloudflare download size in KB when _USENETWORKMONITOR=1 (default 100).

