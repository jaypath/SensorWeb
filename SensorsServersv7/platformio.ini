board_build.mcu = esp32s3
board_build.partitions = partitions_8mb_ota_no_spiffs.csv
board_build.f_cpu = 240000000L
upload_protocol = espota
upload_port = 192.168.68.166 --auth=12345678
build_flags = 
	${env:Clock480X480_USB.build_flags}
build_unflags =;unbuild flags for ADC
	-D _USEADCATTEN=ADC_6db ;ADC_11db, ADC_6db, or ADC_2_5db or ADC_0db (for esp32 adc)
	-D _USEADCBITS=10 ;10, 11, or 12 (for esp32 adc)
lib_deps = 
	${env:Clock480X480_USB.lib_deps}




