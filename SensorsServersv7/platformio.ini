[env:OutShed_USB]
custom_sdkconfig = ${nimble_esp32.custom_sdkconfig}
custom_component_remove = ${nimble_esp32.custom_component_remove}
monitor_filters = esp32_exception_decoder
lib_deps = 
	${env.lib_deps}
	adafruit/Adafruit BMP280 Library@^2.6.8	
	adafruit/Adafruit ADS1X15 @ ^2.6.0
build_flags = 
	${env.build_flags}
	-D _USE_BLE_PROV=1
	;-D _USESERIAL=115200
	-D _HAS_LOCAL_SENSORS=1
	-D _IS_SERVER_HUB=0
;	-D _USEADCATTEN=ADC_6db ;6db range is 150mv to 1.5v. Using a 20k/4.7k voltage divider that provides a range of about 450mv to 4.5v
	-D NUMDEVICES=5
	-D NUMSENSORS=5
	-D _SENSORHISTORYSIZE=3
	-D _MYDEVICENAME=\"Shed\"
	-D _MYTYPE=4
	-D _SENSORTYPES={4,5,200,73,220}
	;note: pins are negative because they are powered, so use the pins indicated for power	
	-D _SNSPINS={400+0x38,400+0x38,234,226,227} ;//pin number for the sensor, if applicable. 0-99 is anolog in pin, 100-199 is MUX or ADS address, 200-299 is digital in pin, 300-399 is SPI pin, 400-599 is an I2C address. Negative values mean the same, but that there is an associated power pin. -9999 means no pin. 
	-D _POWERPINS={-9999,-9999,-9999,-9999,-9999} ;-9999 means no power pin.
	-D _SENSORNUM=5
	-D _SENSORNAMES={\"Temp\",\"RH\",\"Motion\",\"Lights\",\"Button\"}
	-D _FLAGSTATES={0b10000011,0b10000011,0b00000000,0b00000000,0b00000000} ;//  uint8_t Flags; //RMB0 = Flagged, RMB1 = Monitored, RMB2=LowPower, RMB3-derived/calculated/predictive  value, RMB4 =  Outside sensor, RMB5 = 1 - too high /  0 = too low (only matters when bit0 is 1), RMB6 = flag changed since last read, RMB7 = this sensor is critical and must be monititored (including if a reading is delayed, so I must provide sendingInt)
	-D _INTERVAL_POLL={60,600,30,1,300}
	-D _INTERVAL_SEND={300,300,300,300,0}
	-D _LIMIT_MAX={90,100,1,1,1}
	-D _LIMIT_MIN={25,10,0,0,0}
	-D _USEINTERRUPT=1
	-D _PIN_ENABLE_RCWL=25 ; the RCWL enable output (HIGH = module may fire, LOW = muted). -9999 means no enable pin.
	-D _RCWL_ASSOCIATED_SNS=3 ; prefs index of Lights (type 73)
	-D _BUTTON_ASSOCIATED_SNS=3 ; prefs index of Lights (type 73)
	-D _INTERRUPT_DEBOUNCE_MS=50 ; button rising-edge debounce
	-D _USEAHT=0x38	
	-D _USEI2C=1
	-D _INITDIO_LOW=1

