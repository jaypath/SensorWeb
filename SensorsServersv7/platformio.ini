; Actuator rules. The type table is src/sensors.hpp.
; Rules live in these build flags (RAM at boot). They are not in the prefs blob.
; _RULE_OP: 1 means input >= threshold, 3 means input <= threshold.
; 4 means gap + heat setpoint < threshold. One input per rule (_RULE_IN0). A NAN input is false.
; _RULE_LINKn is the pool index for rule slot n, one entry per prefs index, -1 unused.
; A row may use more than two links. The expression reads those links in order.
; _ACTUATOR_RULESET is one string per prefs index. T uses the next linked rule, F negates it.
;   n is prefix NOT. a, o, x are infix AND, OR, XOR. A missing operator is AND.
;   Omitted string means T. A bad string forces the switch off.
; Type 171 countdown does not use the string. Link 0 is presence, link 1 is the button.
; _ACTUATOR_AUX on that row is the motion-extend cap in seconds.
; Type 173 aggregate uses the ruleset as avg, min, max, or any. Optional :group and
; :indoor or :outdoor. Example: avg:temperature:outdoor. No GPIO. Broadcast only when monitored.
; An average ignores a reading outside its physical range. Temperature, humidity, and
; pressure also ignore a reading more than 2 standard deviations from the others.
; A mixed average flags that. An average of one class does not. It alarms only
; when the result is outside its limits. Min, max, and any do not use these checks.
; A hub's own aggregates default to monitored and critical (0b10001010) so they show on its sensor page.
; Another hub, the first time it registers one, sets override 0b10000011. Those bits stay as the user leaves them.
; A 1 forces that flag bit to 0, whatever the sender stored. 0b10000011 clears flagged, monitored, and critical.
; A sensor that is still monitored, and is flagged or expired, forces ALARM or EXP in the header and can replace the weather icon with those boxes.
; A sensor that is still critical can set that header mark and uses the 1.25× expiry probe. It is drawn in the icon boxes only when a monitored sensor already opened that view.
; Checked sensors are the user's choice, including a type outside the group and a sensor
; that is not flagged outside. Until a selection is saved, a full hub averages that group.
; Without :outdoor, outside-flagged sensors are left out. With :outdoor, only those are used.
; Saving none leaves NAN. Weather hubs read Temp_Outdoor, RH_Outdoor, and hPa_Outdoor
; for the outside temperature, humidity, and pressure shown on the display.
; Type 102 only combines sensors checked on the Setup page.
; Type 174 hydronic zone (BryantHP) is on or off from its ruleset, and only while
; Connex allows heat. It stays on for at least 30 minutes. No GPIO.
; Type 175 is the temperature gap, min(actual - heat setpoint, 0). It is an actuator,
; not a temperature. The upstairs average is type 173 and is not sent.
; The zone rows and the gap rows are sent. The screen's zone 4 temperature is UpT.
;
; Outside: Timer_On_H (162) at prefs 4, window limitMin=-2 (dusk) to limitMax=0.
; Three type-170 switches link pool rule 0: prefs 4 >= 1.
; Shed: type 171 at prefs 3, link 0 = motion 2, link 1 = button 4, aux 120.
